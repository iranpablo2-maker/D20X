name: Publish original threat portraits
on:
  push:
    paths:
      - 'NEX_Arquivos_Secretos_39_Fotos.zip'
      - '.github/workflows/extract-threat-images.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-portraits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract original WebP files from existing package
        run: |
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          archive = Path('NEX_Arquivos_Secretos_39_Fotos.zip')
          if not archive.is_file():
              raise SystemExit('ZIP de fotos não encontrado')
          extracted = 0
          with ZipFile(archive) as z:
              for info in z.infolist():
                  if info.is_dir():
                      continue
                  name = PurePosixPath(info.filename)
                  if (name.is_absolute() or '..' in name.parts or
                      len(name.parts) < 4 or name.parts[:2] != ('assets','ameacas') or
                      name.suffix.lower() != '.webp'):
                      continue
                  dest = Path(*name.parts)
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  dest.write_bytes(z.read(info))
                  extracted += 1
          print(f'Fotografias individuais extraídas: {extracted}')
          if extracted == 0:
              raise SystemExit('Nenhum retrato WebP encontrado no ZIP')
          PY
      - name: Commit original portraits when files changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ameacas/
          if ! git diff --cached --quiet; then
            git commit -m "Publish high resolution threat portraits from ZIP"
            git push
          fi
