# Configuração de produção do D20X no Cloudflare Pages.
# Esta configuração fica junto ao código para evitar divergências de bindings.
name = "d20x"
pages_build_output_dir = "."
compatibility_date = "2026-11-10"

[[d1_databases]]
binding = "D20X_D1"
database_name = "d20x-db"
database_id = "8039a543-e32b-480c-a504-4aadb6590808"

[vars]
FIREBASE_PROJECT_ID = "nex-rpg"
