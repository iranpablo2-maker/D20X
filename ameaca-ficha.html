<style>
:root{color-scheme:dark;--bg:#0a090c;--panel:#171317;--red:#b42f40;--border:#4d3038;--muted:#c6b2ba}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font:14px/1.5 system-ui,"Segoe UI",sans-serif}button,input,textarea{font:inherit}
button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #ef8490;outline-offset:2px}
.shell{max-width:1060px;margin:0 auto;padding:23px 20px 50px}
nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:19px;gap:12px}
nav a{color:#f0c7ce;text-decoration:none;font-weight:600}nav a:hover{text-decoration:underline}
.brand{letter-spacing:.16em;font:700 22px Georgia,serif;color:#fff}
.card{border:1px solid var(--border);border-radius:12px;background:var(--panel);overflow:hidden}
.hero{display:flex;position:relative;isolation:isolate;gap:20px;padding:24px;min-height:184px;align-items:center;background:var(--art,linear-gradient(110deg,#46131c,#151016));background-size:cover;background-position:center}
.hero:before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,#100b10f0,#100b10af 75%,#100b105c)}
.portrait-switch{display:flex;flex-direction:column;align-items:stretch;flex:0 0 144px;gap:8px}
.form-switch{display:none;background:#7f2335;border:1px solid #dd6676;color:#fff;font-weight:650;font-size:11px;line-height:1.35;padding:8px 7px;border-radius:7px;cursor:pointer;text-align:center}
.form-switch:not([hidden]){display:block}
.form-switch:hover{background:#aa3046}
.form-switch:focus-visible{outline:2px solid #ffb2be;outline-offset:3px}
.portrait{position:relative;overflow:hidden;flex:0 0 144px;height:144px;border-radius:9px;border:1px solid #6e3740;background:#260f17a8;display:grid;place-items:center;font:700 65px Georgia,serif;background-position:center;background-size:cover}
.hero h1{font-size:27px;margin:4px 0 6px;line-height:1.2}.eyebrow{color:#f0b0bb;font-size:11px;text-transform:uppercase;letter-spacing:.12em}
.tags{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}.tags span{border:1px solid #85404d;background:#351921c9;border-radius:5px;padding:3px 8px;font-size:11px}
.hp{display:flex;align-items:center;background:#a92337;border:1px solid #db4a5f;margin:20px 20px 10px;height:46px;border-radius:7px}
.hp[hidden]{display:none}.hp button{border:0;background:transparent;color:white;font-size:23px;padding:5px 13px}.hp button:hover{background:#ffffff24}.hp strong{flex:1;text-align:center;font-size:17px}
.tabs{display:flex;gap:15px;justify-content:center;padding:12px 12px 0;border-bottom:1px solid #34292d}
.tabs button{border:0;border-bottom:2px solid transparent;background:transparent;color:#b8a5ad;padding:10px 14px;text-transform:uppercase;font-size:12px}
.tabs button[aria-selected="true"]{color:white;border-color:#db3d50}
.page{padding:24px}.page[hidden]{display:none}
.attributes{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px;text-align:center;margin-bottom:22px}
.attributes small{display:block;color:#c7b3bd}.attributes strong{display:block;font:500 28px Georgia,serif}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:#22171d;border:1px solid #4a323b;border-radius:8px;padding:12px}.stat small{display:block;color:#cdb6be;font-size:11px}.stat strong{font-size:17px}
h2{font-size:18px;font-weight:600;margin:22px 0 9px}.skills{display:grid;gap:6px}
.skill{display:flex;justify-content:space-between;gap:12px;padding:10px;border:1px solid #372b31;border-radius:5px}
.skill button{color:#fff;background:#3b202b;border:1px solid #7c4350;border-radius:5px}
.lines{white-space:pre-line;color:#e7dce0;font-size:13px;margin:0}.muted{color:var(--muted)}.note{border-left:3px solid var(--red);background:#21171c;padding:12px;margin:18px 0;color:#d9bbc5}
.action{border:1px solid #49323a;background:#23181e;padding:14px;border-radius:7px;margin-bottom:10px}
#missing{padding:40px;text-align:center}
@media(max-width:620px){.portrait-switch{flex-basis:96px}.form-switch{font-size:10px;padding:7px 4px}.shell{padding:12px 9px 36px}.hero{padding:12px;gap:11px;min-height:122px}.portrait{flex-basis:96px;height:96px;font-size:40px}.hero h1{font-size:19px}.page{padding:16px 12px}.hp{margin:12px 12px 5px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.tabs{gap:2px}.tabs button{padding:10px 8px}.form-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
 .hp-track{height:9px;background:#512630;border-radius:8px;margin:0 20px;overflow:hidden}
.hp-fill{height:100%;width:100%;background:#e1455d;transition:width .25s}
.hp-controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:10px 20px}
.hp-controls input{width:96px;border:1px solid #874657;background:#160d13;color:white;border-radius:6px;padding:7px}
.hp-controls button,.dice-button{border:1px solid #9f4050;background:#752a38;color:white;padding:7px 10px;border-radius:6px;cursor:pointer;font-size:12px}
.hp-controls[hidden],.hp-track[hidden],.dice-output[hidden]{display:none}
.attributes button{background:transparent;border:1px solid #513743;color:white;width:100%;border-radius:7px;cursor:pointer;padding:7px 0}
.attributes button:hover{background:#3b202d}.attributes button small{display:block}
.attributes .nex-threat-attribute-number{display:flex;align-items:center;justify-content:center;width:100%;min-height:40px;padding:5px;border:1px solid #513743;border-radius:7px;background:transparent;color:inherit;cursor:pointer}
.attributes .nex-threat-attribute-number strong{display:block;font:500 28px Georgia,serif;line-height:1.1}
.attributes .nex-threat-attribute-number:hover{background:#3b202d;border-color:#b64c64}
.attributes .nex-threat-attribute-number:focus-visible{outline:2px solid #e96b83;outline-offset:2px}
.dice-output{margin:12px 20px;border:1px solid #985365;background:#21161d;padding:12px;border-radius:8px}
.dice-output strong{font-size:18px}.dice-button{margin:8px 5px 0 0}

.sense-section .skill{align-items:center}
.sense-section .sense-roll{background:#45212d;color:#fff;border:1px solid #99536a;border-radius:6px;padding:6px 10px;cursor:pointer}
.sense-section .sense-roll:hover{background:#663041}
.sense-roll-result{margin-top:9px;background:#24151e;border:1px solid #8a4356;border-radius:6px;padding:10px;font-weight:600}
.sense-roll-result[hidden]{display:none}
</style>

function getData(){
 const form=baseThreat&&threatForms[threatKey(baseThreat)];
 if(currentForm==="alternativa"&&form)return form.data;
 const original=threatFacts(baseThreat);
 if(form?.normalData){
  const additional=form.normalData;
  // Não perder ações e habilidades completas que já existiam no catálogo.
  const preserve=(field)=>{
   const merged=new Map();
   for(const entry of [...(original[field]||[]),...(additional[field]||[])]){
    if(!entry?.name)continue;
    const id=String(entry.name).trim().toLocaleLowerCase("pt-BR");
    const older=merged.get(id);
    if(!older){merged.set(id,{...entry});continue;}
    const combined={...older,...entry};
    for(const property of ["description","effect","test","damage","type"]){
     if(String(older[property]||"").length>String(entry[property]||"").length)combined[property]=older[property];
    }
    merged.set(id,combined);
   }
   return Array.from(merged.values());
  };
  return {...original,...additional,attributes:{...(original.attributes||{}),...(additional.attributes||{})},actions:preserve("actions"),abilities:preserve("abilities")};
 }
 return original;
}

 if(hasValue(d.weaknesses))characteristics.push("Vulnerabilidades: "+d.weaknesses.join("; "));
 const maneuvers=(d.actions||[]).filter(a=>hasValue(a.name)).map(a=>a.name).slice(0,16);
 const specials=(d.abilities||[]).filter(a=>hasValue(a.name)).map(a=>a.name).slice(0,10);
 const profile=[characteristics.length?"Condições e características verificadas: "+characteristics.join(". ")+".":"",
 maneuvers.length?"Ações registradas para consulta: "+maneuvers.join("; ")+".":"",
 specials.length?"Habilidades próprias identificadas: "+specials.join("; ")+".":""].filter(Boolean);
 const expandedSourceProfile=()=>{
  const parts=[];
  parts.push(threat.name+" integra o catálogo de "+threat.source+" e é classificada como "+(threat.category||"ameaça")+". O elemento associado à ficha é "+threat.element+".");
  if(d.variant)parts.push("Este registro apresenta uma transformação ou variação aplicável a outras fichas, e não necessariamente uma criatura independente com todos os atributos.");
  else {
   const basics=[hasValue(d.vd)?"VD "+d.vd:"",hasValue(d.pv)?"PV "+d.pv:"",hasValue(d.defense)?"Defesa "+d.defense:""].filter(Boolean);
   if(basics.length)parts.push("Os parâmetros de confronto identificados na fonte são "+basics.join(", ")+".");
   if(hasValue(d.movement))parts.push("O deslocamento informado é "+d.movement+", relevante para planejar posicionamento, aproximação e retirada durante o encontro.");
  }
  const actionList=(d.actions||[]).filter(a=>hasValue(a.name)).slice(0,8).map(a=>a.name);
  if(actionList.length)parts.push("A ficha registra ações como "+actionList.join(", ")+". Consulte os testes e dados específicos na aba Combate, quando disponíveis.");
  const abilityList=(d.abilities||[]).filter(a=>hasValue(a.name)).map(a=>a.name);
  if(abilityList.length)parts.push("As habilidades especiais identificadas incluem "+abilityList.join(", ")+", com detalhes de ativação apresentados nas informações de combate.");
  const vulnerabilities=(d.weaknesses||[]).filter(hasValue);
  if(vulnerabilities.length)parts.push("As vulnerabilidades informadas são "+vulnerabilities.join("; ")+".");
  return parts.join("\\n\\n");
 };
 const descriptionText=narrative||expandedSourceProfile();
 $("description").innerHTML='<h2>'+esc(threat.name)+'</h2><p class="muted">'+esc(threat.source)+(d.pdfPage?' · PDF, página '+d.pdfPage:threat.page?' · livro, página '+threat.page:'')+'</p>'+
 '<p class="lines">'+esc(descriptionText)+'</p>'+
 (profile.length?'<h2>Características e comportamento em jogo</h2><p class="lines">'+esc(profile.join("\n\n"))+'</p>':"")+
 '';
 const visiblePV=Number(d.pv);
 $("hpBar").hidden=!(Number.isFinite(visiblePV)&&visiblePV>0);
 $("hpTrack").hidden=!(Number.isFinite(visiblePV)&&visiblePV>0);
 if(!$("hpBar").hidden){$("hpLabel").textContent=visiblePV+" PV";$("hpFill").style.width="100%";}

 activate(activeTab);
}
$("formSwitch").addEventListener("click",switchThreatForm);
document.querySelector(".tabs").addEventListener("click",e=>{const b=e.target.closest("[data-tab]");if(b)activate(b.dataset.tab)});



const embedded=new URLSearchParams(location.search).get("embedded")==="1";
if(embedded){
 document.querySelector(".brand").textContent="NEX | Ficha de Ameaça";
}
// Ajusta a altura da ficha para que a biblioteca use a barra de rolagem do site.
let nexLastSheetHeight=0;
function nexReportSheetHeight(){
 if(window.parent===window)return;
 const height=Math.ceil(document.body.scrollHeight);
 if(height>0&&Math.abs(height-nexLastSheetHeight)>2){
  nexLastSheetHeight=height;
  window.parent.postMessage({type:"nex-threat-sheet-height",height},location.origin);
 }
}
if(window.ResizeObserver)new ResizeObserver(()=>requestAnimationFrame(nexReportSheetHeight)).observe(document.body);
window.addEventListener("load",nexReportSheetHeight);
if(threat){$("screen").hidden=false;render()}else{$("missing").hidden=false}
// A edição na campanha recebe uma cópia dos dados originais da ficha exibida.
if(threat&&new URLSearchParams(location.search).get('campaignEditSource')==='1'&&window.parent!==window){
 const details=getData();
 window.parent.postMessage({
  type:'nex-campaign-threat-source-data',
  key,threat:{name:threat.name,source:threat.source,element:threat.element,category:threat.category},
  details
 },location.origin);
}
</script>
