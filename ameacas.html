<style>
:root{color-scheme:dark;--bg:#0b0b0e;--panel:#181518;--line:#513039;--red:#bd3445;--text:#f7eff1;--muted:#b9a9b0}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 "Segoe UI",system-ui,sans-serif}
button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid #ed7a89;outline-offset:2px}
main{width:min(1120px,100%);padding:25px 22px 55px;margin:auto}
.heading{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;margin-bottom:18px}
.eyebrow{font-size:10px;letter-spacing:.21em;text-transform:uppercase;color:#d78895;font-weight:800}h1{font:600 28px Georgia,serif;margin:3px 0 0}
.hint{color:var(--muted);font-size:12px;margin:5px 0 18px;line-height:1.55}
.filters{display:flex;gap:7px;overflow:auto;padding:3px 0 10px;scrollbar-width:thin}
.filters button{white-space:nowrap;color:#dac4c9;background:transparent;border:0;border-bottom:2px solid transparent;padding:8px 11px;border-radius:0;font-size:13px}
.filters button[aria-pressed="true"]{color:#fff;border-color:#dd4355}
.filters.element button[aria-pressed="true"]{background:#351a22;border-radius:7px;border-color:#d84855}
.search{width:100%;margin:12px 0 18px;border:1px solid #49383e;border-radius:8px;background:#1d1a1e;color:#fff;padding:13px 15px;min-height:45px}
.meta{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12px;color:#c4b0b7;margin-bottom:10px}
#list{display:grid;gap:9px}
.monster{position:relative;isolation:isolate;display:flex;align-items:stretch;min-height:106px;overflow:hidden;border:1px solid #513039;border-radius:8px;background:#1c1319}
.monster::before{content:"";position:absolute;inset:0;z-index:-2;background:var(--art,linear-gradient(135deg,#312028,#100e12));background-size:cover;background-position:center;opacity:.87}
.monster::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(12,8,11,.96),rgba(15,8,11,.72) 45%,rgba(7,6,8,.30))}
.emblem{width:100px;min-width:100px;display:grid;place-items:center;font:700 35px Georgia,serif;color:#f6d6db;border-right:1px solid #693842;background:#180e1599}
.details{min-width:0;padding:14px 13px;flex:1}.details strong{font-size:15px;display:block;line-height:1.3}.details small{display:block;color:#e4b8c4;font-size:11px;margin-top:3px}
.details .source{font-size:10px;color:#c1b5be}
.monster button{align-self:end;margin:0 13px 13px 0;padding:8px 20px;border:1px solid #cc5560;border-radius:5px;background:#ac2938;color:white;font-size:12px;font-weight:700}
.monster button:hover{background:#cf3a4c}
.empty{padding:30px;text-align:center;border:1px dashed #50323d;border-radius:8px;color:#baa9b3}
.note{background:#161317;border-left:3px solid #bd4150;padding:12px;font-size:11px;color:#d5b9c0;border-radius:0 6px 6px 0}
dialog{width:min(95vw,680px);max-height:89vh;overflow:auto;background:#151114;color:white;border:1px solid #8d3b4a;border-radius:12px;padding:0;box-shadow:0 30px 90px #000e}dialog::backdrop{background:#000c}
.sheet-top{position:relative;padding:26px;background:var(--art);background-size:cover;background-position:center}
.sheet-top:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#0b080de8,#0b080d77)}
.sheet-top>*{position:relative}.sheet-top h2{margin:2px 35px 4px 0;font-size:25px}
.close{position:absolute!important;right:12px;top:10px;border:0;background:#2b1b26;color:white;border-radius:5px;padding:6px 11px;font-size:22px;z-index:2}
.sheet-body{padding:21px}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-bottom:14px}
.stat{border:1px solid #55313f;border-radius:7px;padding:10px;background:#24191f}.stat label{display:block;font-size:10px;color:#c8aeb8}.stat strong{font-size:14px}
@media(max-width:560px){main{padding:15px 11px 40px}.emblem{width:75px;min-width:75px}.details{padding:12px 9px}.monster button{margin:0 9px 10px 0;padding:7px 12px}.stats{grid-template-columns:repeat(2,1fr)}}
/* Retratos das ameaças: moldura e escala padronizadas. */
.monster{min-height:112px}
.monster .emblem{flex:0 0 112px;width:112px;min-width:112px;height:112px;align-self:center;overflow:hidden;position:relative}
.monster .emblem img[data-archive-portrait],
.monster .emblem img[data-february-key]{display:block;width:100%!important;height:100%!important;object-fit:cover!important;object-position:center center!important}
@media(max-width:560px){
 .monster{min-height:88px}
 .monster .emblem{flex-basis:88px;width:88px;min-width:88px;height:88px}
}
 .monster .emblem img[data-archive-portrait][data-bilu="true"]{object-fit:contain!important;background:#1a1117!important;padding:3px}

.threat-sheet .threat-attributes strong{display:block;font:600 24px/1.4 Georgia,serif;color:#fff}
.threat-sheet .threat-defenses{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;text-align:center;margin:14px 0 20px}
.threat-sheet .threat-defenses small{display:block;color:#b5a0ae;text-transform:uppercase;font-size:12px}
.threat-sheet .threat-defenses strong{font-size:22px;font-weight:500}
.threat-sheet h3{font:500 20px/1.3 "Segoe UI",sans-serif;margin:18px 0 7px}
.threat-sheet .threat-status-title{text-align:center}
.threat-sheet .threat-skills{display:grid;gap:3px}
.threat-sheet .threat-skill{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;border:1px solid #29252a;text-transform:uppercase;font-size:12px;background:#101013}
.threat-sheet .threat-skill button{border:0;background:none;color:#f5eaf2;font-weight:600;white-space:nowrap}
.threat-sheet .threat-skill button:hover{color:#ec6879}
.threat-sheet .threat-section{margin:19px 0}
.threat-sheet .threat-section h3{margin:0 0 5px}
.threat-sheet .threat-line{font-size:12px;color:#fff;margin:4px 0;white-space:pre-wrap}
.threat-sheet .threat-muted{color:#ad9ca6;font-size:12px}
.threat-sheet .threat-action{padding:13px;margin:9px 0;border:1px solid #46323a;border-radius:7px;background:#20181d}
.threat-sheet .threat-action strong{display:block;margin-bottom:5px}

async function nexCropAtlasPortrait(atlas){

 if(!atlas.src||!Number.isInteger(index)||index<0||index>=columns*rows)return null;
 try{
  const image=new Image();
  await new Promise((resolve,reject)=>{
   image.onload=resolve;image.onerror=reject;image.src=atlas.src;
  });
  const cellWidth=image.naturalWidth/columns,cellHeight=image.naturalHeight/rows;
  if(!cellWidth||!cellHeight)return null;
  const canvas=document.createElement('canvas');
  canvas.width=Math.round(cellWidth);canvas.height=Math.round(cellHeight);
  const ctx=canvas.getContext('2d');
  if(!ctx)return null;
  ctx.drawImage(image,(index%columns)*cellWidth,Math.floor(index/columns)*cellHeight,cellWidth,cellHeight,0,0,canvas.width,canvas.height);
  return canvas.toDataURL('image/webp',0.92);
 }catch(error){console.warn('NEX: retrato do atlas indisponível',error);return null;}
}

 if(atlas){
  const cropped=await nexCropAtlasPortrait(atlas);
  if(cropped)return {url:cropped,previewOnly:true};
  return {atlas:atlas.src,columns:4,rows:5,index:Number(atlas.index),previewOnly:true};
 }
 return {};
}
if(nexPortraitProvider){
 window.addEventListener('message',async event=>{
  if(event.origin!==location.origin||event.source!==window.parent||event.data?.type!=='nex-request-threat-portraits')return;
  const keys=Array.isArray(event.data.keys)?event.data.keys.slice(0,125):[];
  for(const key of keys){
   if(typeof key!=='string'||key.length>240)continue;
   const threat=records.find(x=>threatKey(x)===key);
   if(!threat)continue;
   const portrait=await nexResolvePortrait(threat);
   window.parent.postMessage({type:'nex-threat-portrait-result',key,portrait},location.origin);
  }
 });
}
window.addEventListener("message",e=>{
 if(e.origin===location.origin&&e.source===threatDetailFrame.contentWindow&&e.data?.type==='nex-threat-dice-roll'){
  const options=e.data.options;
  if(!options||typeof options.expression!=='string'||options.expression.length>360)return;
  if(window.parent!==window){
   window.parent.postMessage({type:'nex-threat-dice-roll',options},location.origin);
  }else{
   window.NEX_DICE_UI?.roll(options);
  }
  return;
 }
 if(nexCampaignThreatPicker&&e.origin===location.origin&&e.source===window.parent){
  if(e.data?.type==="nex-campaign-threat-picker-state"&&Array.isArray(e.data.keys)){
   nexCampaignAddedThreatKeys=new Set(e.data.keys.filter(x=>typeof x==="string"));draw();
  }
  return;
 }
 if(e.origin!==location.origin||e.source!==threatDetailFrame.contentWindow)return;
 if(e.data?.type==="nex-threat-sheet-height"){
  const h=Number(e.data.height);
  if(Number.isFinite(h)&&h>0&&h<70000)threatDetailFrame.style.height=Math.ceil(h+12)+"px";
  return;
 }
 if(e.data?.type==="nex-threat-back")closeThreatDetail();
});
// Envia a altura real da biblioteca para a página principal: uma única rolagem.
let nexLastLibraryHeight=0;
function nexReportLibraryHeight(){
 if(window.parent===window)return;
 const height=Math.ceil(document.body.scrollHeight);
 if(height>0&&Math.abs(height-nexLastLibraryHeight)>2){
  nexLastLibraryHeight=height;
  window.parent.postMessage({type:"nex-threat-library-height",height},location.origin);
 }
}
if(window.ResizeObserver)new ResizeObserver(()=>requestAnimationFrame(nexReportLibraryHeight)).observe(document.body);
window.addEventListener("load",nexReportLibraryHeight);

draw();
</script></body></html>
